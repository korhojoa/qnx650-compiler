name: compiler image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the checked compiler image to GHCR for public use
        type: boolean
        default: false
      runner:
        description: Runner label with enough storage for the source build
        type: string
        default: qnx650-compiler
      jobs:
        description: Parallel jobs for the Rust build (empty = one per CPU)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  compiler:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect the runner
        run: |
          podman --version
          df -h .
          free -h
          storage=$(podman info --format '{{.Store.GraphRoot}}')
          mkdir -p "$storage"
          available=$(df -Pk "$storage" | awk 'NR == 2 {print $4}')
          if [ "$available" -lt 52428800 ]; then
            echo 'The full source build requires 50 GiB of free build storage.' >&2
            echo 'Select a runner with more storage.' >&2
            exit 1
          fi
      - name: Assemble and test the compiler image
        env:
          BUILD_JOBS: ${{ inputs.jobs }}
        run: scripts/build-compiler-image.sh
      - name: Upload the compiler image
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_ACTOR: ${{ github.actor }}
          SOURCE_REVISION: ${{ github.sha }}
        run: scripts/publish-compiler.sh
