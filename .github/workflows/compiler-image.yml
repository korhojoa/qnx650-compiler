name: compiler image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the checked compiler image to GHCR for public use
        type: boolean
        default: false
      runner:
        description: Runner label with enough storage for the source build
        type: string
        default: qnx650-compiler
      jobs:
        description: Parallel jobs for the Rust build (empty = one per CPU)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  compiler:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect the runner
        run: |
          podman --version
          df -h .
          free -h
          storage=$(podman info --format '{{.Store.GraphRoot}}')
          mkdir -p "$storage"
          available=$(df -Pk "$storage" | awk 'NR == 2 {print $4}')
          # A cold build adds about 20 GB to the store on this host's zfs
          # (measured 2026-10-03: 14 GB for the Rust and compiler stages, 6 GB
          # for the GCC chain). The step after the build prints each run's
          # growth; update this bound from those numbers, not from a guess.
          if [ "$available" -lt 25165824 ]; then
            echo 'The build needs 24 GiB of free build storage.' >&2
            exit 1
          fi
          echo "STORE_KB_BEFORE=$(du -sk "$storage" | cut -f1)" >> "$GITHUB_ENV"
      - name: Assemble and test the compiler image
        env:
          BUILD_JOBS: ${{ inputs.jobs }}
        run: scripts/build-compiler-image.sh
      - name: Report the build storage growth
        if: always()
        run: |
          storage=$(podman info --format '{{.Store.GraphRoot}}')
          after=$(du -sk "$storage" | cut -f1)
          echo "store before: $((STORE_KB_BEFORE / 1024)) MiB, after: $((after / 1024)) MiB, growth: $(((after - STORE_KB_BEFORE) / 1024)) MiB"
          df -h "$storage"
      - name: Upload the compiler image
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_ACTOR: ${{ github.actor }}
          SOURCE_REVISION: ${{ github.sha }}
        run: scripts/publish-compiler.sh
