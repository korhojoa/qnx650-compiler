name: public image check

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Uploaded compiler image digest, starting with sha256
        type: string
        required: true

permissions:
  contents: read

jobs:
  public-image:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    container: ubuntu:26.04@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03
    steps:
      - name: Install verification tools
        run: apt-get update && apt-get install -y ca-certificates curl git jq
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify public registry access
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: |
          owner=$(printf '%s' "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')
          scripts/check-public-image.sh "ghcr.io/$owner/qnx650-compiler@$IMAGE_DIGEST"
