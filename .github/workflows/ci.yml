name: source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    container: ubuntu:26.04@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03
    steps:
      - name: Install static-analysis tools
        run: apt-get update && apt-get install -y shellcheck ripgrep python3 git jq
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check release contract
        run: scripts/check-release-readiness.sh
